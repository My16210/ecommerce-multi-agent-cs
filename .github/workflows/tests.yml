# 最小 CI：装依赖 → ruff → pytest。
#
# 【为什么是"最小"而不是一套完整的流水线】
# 这个仓库此前**一条 CI 都没有**。加 CI 的价值在于"测试绿"从**本机的一次性
# 观察**变成**每次提交都要满足的条件**——这一条做到了，剩下的（矩阵、覆盖率
# 上报、构建镜像、发布）都是在此之上加东西，可以后加。反过来先铺一堆用不上的
# job，只会让第一次红的时候不知道该信哪个。
#
# 【版本号：两个 action 钉的方式**故意不一样**，因为它们的 tag 策略不一样】
#
#   actions/checkout@v7       —— 大版本 tag（可移动）。它确实发 `v7`，且 v7 就是当前
#                                大版本（最新 release v7.0.1），所以钉大版本能自动拿补丁。
#   astral-sh/setup-uv@v10.3.0 —— **精确版本**，不是 v10。
#
# 为什么 setup-uv 不钉 v10：**它根本没有 `v10` 这个 tag**。实测（2026-10-11）——
# 它的大版本 tag 只发到 `v7` 就停了，之后只发 `v10.0.1`/`v10.3.0` 这种精确版本。
# 所以"钉大版本"这条路在它身上是走不通的：`@v10` 会让整个 job 在
# **"Set up job" 阶段就失败**，报 `unable to find version v10`，连 checkout 都跑不到。
# （第一次推上去就是这么红的。这种红很好认：它发生在任何 step 之前。）
#
# 代价如实说：精确版本不会自动吃安全补丁，得手动升。这是它自己的 tag 策略逼出来的，
# 不是更稳妥的选择——想要自动补丁就得退到 `@v7`，但那已经落后三个大版本了。
#
# 查法（以后要升的时候照做）：读 latest release，再确认那个大版本号有没有对应的 tag。
#   curl -x http://127.0.0.1:7897 -H "Authorization: Bearer $TOKEN" \
#        https://api.github.com/repos/OWNER/REPO/releases/latest
#   git ls-remote --tags https://github.com/OWNER/REPO | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+$'
name: tests

on:
  push:
    branches: [main]
  pull_request:

# 默认 token 权限是读写全部，测试只需要读。显式收窄。
permissions:
  contents: read

# 同一分支连推时取消上一次，省 runner，也让"最新一次的结果"就是当前的结果。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # 正常跑完约 3~5 分钟（装 144 个包是大头）。给足余量，但别设成无限——
    # 卡住时应该失败得响亮，而不是耗满 GitHub 的 6 小时上限。
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # 【这里**故意没有** python-version 之类的输入】
      # 一开始写的是 `python-version-file: .python-version`——**那个输入名不存在**。
      # 官方 action.yml 里只有 `python-version`（一个版本号字符串）和 `version-file`
      # （管 uv 自己的版本，不是 Python 的）。名字写错的后果特别隐蔽：action 只打一条
      # "Unexpected input(s) ... valid inputs are [...]" 的 warning 就**忽略它**，
      # 而 workflow 照样绿——看着像钉住了版本，其实什么都没做。
      #
      # 但 Python 版本仍然只有一处来源：uv 自己会读仓库根的 .python-version。
      # CI 日志里是 "Using CPython 3.11.17"，和本机、和 Dockerfile 同一个版本。
      # 所以这里**什么都不写才是对的**——写了就等于在第二个地方再维护一个版本号。
      - name: 装 uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # --frozen：uv.lock 和 pyproject.toml 一旦不一致就**在装依赖这一步红**，
      # 而不是等到运行时才发现锁文件没跟上。锁文件漂移是那种"本机永远是好的"
      # 的问题，正好交给 CI。
      #
      # --all-extras 而不是只挑几个：`ui`（streamlit）和 `api`（fastapi）的测试
      # 靠 importorskip 决定跳不跳，少装一个 extra 不会报错，只会**静悄悄少跑一批**。
      - name: 装依赖
        run: uv sync --all-extras --frozen

      - name: ruff
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest
        env:
          # 仓库里有一批中文输出和编码相关的坑（README「踩过的坑」里那条 CLI 字符集）。
          # runner 默认不是 UTF-8，这里钉死。
          PYTHONUTF8: "1"
          # 沙箱在 import pyplot 之前已经强制 Agg 了，这里是双保险：
          # headless runner 上因为缺 DISPLAY 而崩，是那种和被测代码无关的红。
          MPLBACKEND: Agg

      # 【预期结果：以当次 pytest 输出为准，这里不再抄数字】
      # 这一段原来写死了"517 passed / 3 skipped / 520 条"，后来测试加了一百多条，
      # 注释没跟着改——**文档就这样变成了假话**。次数会随测试增加而变，写死它只会
      # 制造下一次漂移；真正该固定的是"0 failed"和"skip 的原因"：
      #   · 跳过的是需要真服务的 Milvus、需要装 streamlit 的真界面渲染；
      #   · 干净 checkout 没灌数据时，界面真渲染那条会 skip，**不是环境坏了**。
      #
      # 【runner 上没有中文字体】出图那条测试会打几行 findfont warning，
      # 但它只断言"文件存在"、不校验像素，**不会红**（图确实是豆腐块）。
      # 不为此装 fonts-noto-cjk：会让 CI 变重，而它修的是一个没人看的差异。
