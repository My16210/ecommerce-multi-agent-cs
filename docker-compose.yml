# ============================================================================
# 多 Agent 电商智能客服 —— 部署编排
#
# 默认（不带 profile）起两个服务，向量库用 Chroma 嵌入式、订单库用 SQLite，
# **零外部依赖**：
#     docker compose up -d
#     → http://localhost:8501       客户界面（app.py）
#     → http://127.0.0.1:8502       后台管理端（admin.py，需要 .env 里的 ADMIN_PASSWORD）
#
# 两个是**并列的两个入口**，不是一个套一个：app 面向客户演示，admin 给人下
# 结论用（目前只有"批准退货"）。它们共用同一个镜像，只是 CMD 不同。
# **两条都只绑 127.0.0.1**，理由写在 admin 服务上方。
# 想从别的机器/手机访问客户界面（它本来就没有鉴权，更没有理由默认敞着）：
#     APP_BIND=0.0.0.0 docker compose up -d
#
# 要换成 Milvus：加上 `milvus` profile，四个服务一起起
#     docker compose --profile milvus up -d
#
# 首次跑要点一次库和一次入库（都复用同一个镜像，跑完即弃）：
#     docker compose run --rm app python main.py --init-db                  # 65752 笔订单
#     docker compose run --rm app python -m ecom.knowledge.cli.ingest       # 建向量库
#
# 其它常用的一次性命令：
#     docker compose run --rm app python main.py "订单 52644 到哪了" -v     # 命令行问答
#     docker compose run --rm app python -m ecom.knowledge.cli.review list  # 人审队列
#     docker compose run --rm app python -m ecom.analytics.cli.main         # 数据分析单跑
#
# 验证状态：**镜像构建过、容器真跑过**（本机 PyPI 不通，但 docker build 里通）。
# 已验：`docker compose config` 能解析、`docker build` 装成 150 个包、
#       `docker compose run --rm app python -m ecom.analytics.cli.analyze "…"`
#       在容器里走完整条链路并出图。
# 未验：界面**没在浏览器里打开过**，`--profile milvus` 那一支也没真起过
#       （本机 19530 上已经有一个 Milvus 在跑，不该去动它）。
# 如实记在 README 的「验证到哪一步」。
# ============================================================================

name: ecom-cs

services:
  # --------------------------------------------------------------------------
  # 应用（统一 Streamlit 界面 + 三个子系统）
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
    image: ecom-cs:local

    # 密钥从**运行时**注入，不烤进镜像。
    # required: false 让"还没建 .env"时 docker compose config/up 不会直接报错
    # （真正的报错推迟到应用启动、给出"缺少 QWEN_API_KEY，请在 .env 中配置"）。
    #
    # ⚠️ 一个容易踩的坑：`docker compose config` 会把 env_file 的内容**解析并
    #    打印出来**——也就是说 `docker compose config > x.yaml` 会把真密钥写进
    #    那个文件。要贴日志、要发到群里之前，先确认手里那份不是 config 的输出。
    env_file:
      - path: .env
        required: false

    environment:
      # 这两个放这里而不是 .env，是因为它们在"容器里"和"宿主上"该取不同的值。
      #
      # MILVUS_URI 尤其要注意：.env 里写的是 http://localhost:19530，
      # 在容器里那个 localhost 指向**容器自己**，连不到任何东西。
      # 而 compose 的 ${VAR} 插值会读项目根的 .env，所以这里不能复用同名变量，
      # 换个前缀 DOCKER_MILVUS_URI，默认指向 profile 里的服务名。
      # 想用宿主上已经跑着的那个 Milvus（本机 19530 就有），改成：
      #     DOCKER_MILVUS_URI=http://host.docker.internal:19530
      VECTOR_BACKEND: ${VECTOR_BACKEND:-chroma}
      MILVUS_URI: ${DOCKER_MILVUS_URI:-http://milvus:19530}

      # 想接宿主上那个 MySQL（本机 docker 里的 mysql8 发布在 3308）就加这几行：
      #     ORDER_DB_DSN: mysql://root:<password>@host.docker.internal:3308/ecom_cs
      # 容器里不能用 127.0.0.1 指宿主——那是容器自己。

    ports:
      # 8501 是本机空闲端口；被占了就 APP_PORT=8600 docker compose up -d
      #
      # 【左边的 127.0.0.1 不能省——和 admin 那条同一个理由，见下方 admin 服务上方
      # 那段长注释】这个界面**没有任何鉴权**，而它能触发一次数据分析，也就是**让
      # 模型生成的 Python 跑起来**（沙箱不是强隔离，见 docs/上线清单.md 第 2、3 条）。
      # 只写 "8501:8501" 等于绑所有网卡，同局域网里任何人都能打开它。
      #
      # 本机访问完全不受影响：http://localhost:8501 走的本来就是回环地址。
      # 要拿到别的机器上演示就显式放开 APP_BIND=0.0.0.0——那一刻是**你自己**决定
      # 把它暴露出去的，而不是默认就敞着。
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8501}:8501"

    volumes:
      # 为什么是 bind mount 而不是 named volume：
      #   三个子系统的数据都锚在 ROOT/data 下（容器里 = /app/data），卷必须正好
      #   挂在那里。**这正是"数据收到一处"的直接收益**——合并前三份数据在三个
      #   仓库各自的 data/ 里，这个卷得挂三次。
      #
      #   挂宿主目录带来两个好处：
      #   ① 宿主上已经建好的向量库、订单库、图表目录**开箱即用**，容器起来
      #      不用重跑 ingest；
      #   ② 语料仍然在磁盘上，维持"磁盘上的文本是唯一真源"那条约定。
      #   代价：Ubuntu 上卷里文件的属主不是容器内的 app 用户，要做一次
      #     sudo chown -R 1000:1000 data logs
      #   （或构建时用 --build-arg APP_UID=$(id -u) 对齐）。Windows 的 Docker
      #   Desktop 会把权限放宽，通常不用管。
      - ./data:/app/data
      - ./logs:/app/logs

    # extra_hosts 是为了让 host.docker.internal 在 Linux 上也解析得到
    # （Docker Desktop 自带，Linux 原生需要显式声明）
    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    # 健康检查继承镜像里那份（Streamlit 的 /_stcore/health），不在这里重复一遍。

  # --------------------------------------------------------------------------
  # 后台管理端（另一个入口，同一个镜像）
  #     docker compose up -d
  #     → http://127.0.0.1:8502
  # --------------------------------------------------------------------------
  # 【为什么它必须在这里，而不是"让用户自己 streamlit run admin.py"】
  # **本机 PyPI 不通，用户根本装不了 streamlit。** app.py 一直是靠 compose 跑的，
  # 后台也得有自己那一条，否则这个入口在用户的机器上打不开——写了等于没写。
  #
  # 【端口绑 127.0.0.1，不绑 0.0.0.0——这是密码之外的第二层】
  # 两层挡的不是同一件事：口令挡"能连到这个端口的人"，绑定挡"根本连不到这个
  # 端口的人"（同局域网的另一台机器、宿主上任何程序）。**两层都要有。**
  # 注意 `ports` 左半边写 127.0.0.1 才有效——只写 "8502:8502" 等于绑所有网卡。
  #
  # 后来 app 那条也照这个改了（它没有密码那一层，所以绑定是它**唯一**的一层）。
  #
  # 副作用（要如实说）：**这也意味着它不能被反向代理从外面转发**。真上线时得
  # 把那层代理自己接过来，而不是把这一行改回 0.0.0.0。
  admin:
    build:
      context: .
    image: ecom-cs:local

    # 和 app 一样：密钥运行时注入，不烤进镜像。ADMIN_PASSWORD 也走这里——
    # 没配的话 admin.py 会 **st.error + st.stop**（fail closed，见 admin.py）。
    env_file:
      - path: .env
        required: false

    # 覆盖镜像里的 CMD：同一个镜像跑另一个入口。
    # --server.address=0.0.0.0 仍然要写（容器内得监听所有网卡，由上面的
    # ports 那一行负责只把它发布到宿主本机）。
    command: [
      "streamlit", "run", "admin.py",
      "--server.address=0.0.0.0",
      "--server.port=8502",
      "--server.headless=true",
      "--browser.gatherUsageStats=false",
    ]

    ports:
      # 左边的 127.0.0.1 **不能省**。被占了就 ADMIN_PORT=8602 docker compose up -d
      - "127.0.0.1:${ADMIN_PORT:-8502}:8502"

    volumes:
      # 和 app 是同一份数据。两个容器同时连一个 sqlite 文件是安全的——
      # 会话库开了 WAL + busy_timeout（见 session.py），退货审核动订单库，
      # 客服工作台回复 / 认领工单会和 app 同时写会话库，靠的是同一套设置。
      - ./data:/app/data
      - ./logs:/app/logs

    # 【健康检查必须覆盖，不能继承】镜像里那份 HEALTHCHECK 探的是 8501
    # （CMD 里写死的端口），而这个容器跑的是 8502——不覆盖的话它会**永远不健康**，
    # 而服务其实是好的。这种"探针指着另一个端口"的错，看日志是看不出来的。
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request\nok = False\ntry:\n    ok = urllib.request.urlopen('http://127.0.0.1:8502/_stcore/health', timeout=3).status == 200\nexcept Exception:\n    pass\nsys.exit(0 if ok else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 以下三个只在 `--profile milvus` 时启动
  # --------------------------------------------------------------------------
  etcd:
    profiles: ["milvus"]
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    profiles: ["milvus"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    profiles: ["milvus"]
    # 版本要和 pyproject 里 pymilvus 的 pin 对上：pymilvus>=2.6,<3 ↔ Milvus server 2.6.x。
    # 两边版本不对齐时 MilvusStore 会在连接阶段报错，措辞和"服务没起来"很像，
    # 不容易往版本上想，所以这条对应关系写在这里。
    image: milvusdb/milvus:v2.6.24
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      # 只发布 gRPC 这一个口，且**故意避开 19530**：
      # 本机 19530 上已经有一个 milvus-standalone 在跑，照抄常规端口必然冲突。
      # etcd / minio 干脆不发布——应用走 compose 内网就够了，
      # 发布端口只是为了调试。要调试就临时加 ports。
      #
      # 这条设计是从 RAG 那个仓库原样保留的，不是重新想的：它当初就是为了
      # "让容器里的 Milvus 和宿主上那个常年跑着的互不干扰"。
      - "${MILVUS_HOST_PORT:-19531}:19530"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  # 说明：app 没有写 depends_on: milvus。
  # 原因是 compose 对"依赖一个只存在于某个 profile 里的服务"处理得别扭——
  # 不带 profile 启动时容易报 undefined dependency。而 Milvus 这条路，
  # 起不来的时候 MilvusStore 自己会抛一条能照着做的错误（连不上会提示先起服务），
  # 比编排层的依赖约束更直接。所以顺序交给文档：
  #   docker compose --profile milvus up -d   # 四个一起起
  # 若 app 比 milvus 先就绪导致第一问失败，重试一次即可（Milvus 的
  # start_period 是 90s）。
